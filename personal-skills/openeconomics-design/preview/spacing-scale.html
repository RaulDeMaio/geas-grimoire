<!-- @dsCard group="Spacing" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: #fff; padding: 24px 28px; box-sizing: border-box; }
  .meta {
    font-family: var(--oe-font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--oe-gray-500);
    margin-bottom: 14px;
  }
  .row { display: grid; grid-template-columns: 60px 1fr 60px; gap: 14px 18px; align-items: center; max-width: 640px; }
  .name { font-family: var(--oe-font-mono); font-size: 12px; color: var(--oe-gray-700); }
  .val { font-family: var(--oe-font-mono); font-size: 12px; text-align: right; color: var(--oe-gray-500); }
  .bar { background: var(--oe-bluette-700); height: 12px; border-radius: 2px; }
</style>
</head>
<body>
<div class="meta">Spacing scale · 4-pt base</div>
<div class="row">
  <div class="name">--space-1</div><div class="bar" style="width:4px"></div><div class="val">4px</div>
  <div class="name">--space-2</div><div class="bar" style="width:8px"></div><div class="val">8px</div>
  <div class="name">--space-4</div><div class="bar" style="width:16px"></div><div class="val">16px</div>
  <div class="name">--space-5</div><div class="bar" style="width:20px"></div><div class="val">20px</div>
  <div class="name">--space-6</div><div class="bar" style="width:24px"></div><div class="val">24px</div>
  <div class="name">--space-8</div><div class="bar" style="width:40px"></div><div class="val">40px</div>
  <div class="name">--space-9</div><div class="bar" style="width:52px"></div><div class="val">52px</div>
  <div class="name">--space-11</div><div class="bar" style="width:80px"></div><div class="val">80px</div>
</div>
</body>
</html>
